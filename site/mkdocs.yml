site_name: Meta-programming
site_description: Terminals, APIs, and coding agents — an 8h M2 course (Université de Strasbourg)
repo_url: https://github.com/KnuxV/cours-agents
site_url: https://Knuxv.github.io/cours-agents
docs_dir: docs
site_dir: _site

validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.tabs
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.tracking
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
  - pymdownx.keys

plugins:
  # Listing `plugins` disables the implicit default, so `search` is named here.
  - search
  # Old links given to students must keep working. Left side = the path a page
  # used to have, right side = where it lives now.
  - redirects:
      redirect_maps:
        wsl.md: reference/wsl.md
        pi.md: reference/pi.md
        sessions/s1-collab.md: reference/git-collaboration.md
        today.md: sessions/practice-git.md

nav:
  - Home: index.md
  - Sessions:
      - sessions/index.md
      - Session 0 — Set up your machine: setup.md
      - Session 1 — Git:
          - Lesson — Git: sessions/s1.md
          - Class plan — tutor, then three exercises: sessions/practice-git.md
      - Session 2 — Python tooling: sessions/s2.md
      - Session 3 — What an LLM API is:
          - Lesson — What an LLM API is: sessions/s3.md
          - Class plan — meet the agent: sessions/practice-agents.md
      - Session 4 — pi, a real harness: sessions/s4.md
      - Optional — Replication track: replication.md
  - ✏️ Exercises:
      - exercises/index.md
      - Terminal:
          - 0.1 Ten minutes in the terminal: exercises/terminal.md
      - Git:
          - 1.1 Recipe history: exercises/recipe.md
          - 1.2 Scrabble — merge and conflict: exercises/scrabble.md
          - 1.3 Collaboration, in teams of two: exercises/collab.md
          - Extra — three merges in a row: exercises/scrabble-three-merges.md
      - Python tooling:
          - 2.1 A uv project from scratch: exercises/uv-project.md
          - 2.2 Notebook → script with argparse: exercises/argparse-script.md
          - 2.3 Password generator: exercises/password-generator.md
          - 2.4 Secret hygiene audit: exercises/secret-audit.md
          - 2.5 Polars vs pandas: exercises/polars-pandas.md
      - Agents:
          - 3.1 Agent lab — six tasks against a dataset: exercises/agent-lab.md
  - Reference:
      - reference/index.md
      - Machines and terminals:
          - WSL, explained: reference/wsl.md
      - Git:
          - Git as a collaboration tool: reference/git-collaboration.md
      - Agents and tools:
          - pi — install, connect, tutor: reference/pi.md
      - Files and configs: resources.md
