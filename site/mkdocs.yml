site_name: Meta-programming
site_description: Terminals, APIs, and coding agents — an 8h M2 course (Université de Strasbourg)
repo_url: https://github.com/KnuxV/cours-agents
site_url: https://Knuxv.github.io/cours-agents
docs_dir: docs
site_dir: _site

validation:
  anchors: warn
  links:
    absolute_links: warn
    unrecognized_links: warn

theme:
  name: material
  language: en
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - content.code.copy
    - content.tabs.link
    - navigation.sections
    - navigation.top
    - search.suggest
    - toc.follow

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets:
      base_path: [".."]
      check_paths: true
  - pymdownx.keys

nav:
  - Home: index.md
  - Session 0 — Setup (homework):
      - Lesson — Setup: setup.md
      - Lesson — WSL, explained: wsl.md
      - ✏️ 0.1 Ten minutes in the terminal: exercises/terminal.md
  - Session 1 — Git:
      - Lesson — Git: sessions/s1.md
      - Reading — Git as a collaboration tool (S1½): sessions/s1-collab.md
      - ✏️ 1.1 Recipe history: exercises/recipe.md
      - ✏️ 1.2 Scrabble — merge and conflict: exercises/scrabble.md
      - ✏️ 1.3 Collaboration in teams of two: exercises/collab.md
      - ✏️ Extra — three merges in a row: exercises/scrabble-three-merges.md
  - Session 2 — Python tooling:
      - Lesson — Python tooling: sessions/s2.md
      - ✏️ 2.1 A uv project from scratch: exercises/uv-project.md
      - ✏️ 2.2 Notebook → script with argparse: exercises/argparse-script.md
      - ✏️ 2.3 Password generator: exercises/password-generator.md
      - ✏️ 2.4 Secret hygiene audit: exercises/secret-audit.md
      - ✏️ 2.5 Polars vs pandas: exercises/polars-pandas.md
  - Session 3 — What an LLM API is:
      - Lesson — What an LLM API is: sessions/s3.md
  - Session 4 — pi:
      - Lesson — pi: sessions/s4.md
  - ▶ Today — Fri 18 Sep:
      - Start here — plan for today: today.md
      - pi — install, API connection, tutor: pi.md
  - ✏️ All exercises: exercises/index.md
  - Resources: resources.md
  - Replication track (optional): replication.md
